<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оркестр 1703 — Самый Нестандартный Оркестр</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Dela Gothic One (DRUZHOK), Playfair Display (Despair Display - no italic), Syne & Plus Jakarta Sans (Steppe) -->
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #efe3da;
            color: #143127;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Настройка фирменных шрифтов из гайдлайна */
        .font-druzhok {
            font-family: 'Dela Gothic One', cursive;
        }
        .font-despair {
            font-family: 'Despair Display', serif;
            font-weight: 900;
            font-style: normal; /* Исключаем курсив по желанию пользователя */
        }
        .font-steppe {
            font-family: 'Steppe', sans-serif;
            font-weight: 800;
        }

        /* Применение SVG фильтра гравюры/полутонов */
        .brand-engraving {
            filter: url(#halftone-engraving);
            transition: filter 0.3s ease;
        }
        .brand-engraving:hover {
            filter: none; /* Эффект раскрытия цвета при наведении */
        }

        /* Необруталистические тени и кнопки */
        .neo-btn {
            border: 3px solid #143127;
            box-shadow: 4px 4px 0px 0px #143127;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .neo-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px #143127;
        }
        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px #143127;
        }

        .neo-card {
            border: 3px solid #143127;
            box-shadow: 6px 6px 0px 0px #143127;
            background-color: #ffffff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .neo-card:hover {
            transform: translateY(-4px);
            box-shadow: 10px 10px 0px 0px #143127;
        }

        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #efe3da;
        }
        ::-webkit-scrollbar-thumb {
            background: #143127;
            border-radius: 5px;
        }

        /* Пульсация каракуль */
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(3deg) scale(1.05); }
        }
        .scribble-animate {
            animation: wiggle 6s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Этот SVG-фильтр в реальном времени переводит любые изображения/видео в фирменную гравюру (Тёмно-зеленый #143127 + Кремовый #efe3da) -->
    <svg class="hidden" width="0" height="0">
        <filter id="halftone-engraving" color-interpolation-filters="sRGB">
            <!-- Шаг 1: Повышаем контраст исходника -->
            <feComponentTransfer>
                <feFuncR type="linear" slope="2" intercept="-0.5"/>
                <feFuncG type="linear" slope="2" intercept="-0.5"/>
                <feFuncB type="linear" slope="2" intercept="-0.5"/>
            </feComponentTransfer>
            <!-- Шаг 2: Обесцвечиваем в монохром -->
            <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0.2126 0.7152 0.0722 0 0 0 0 0 1 0"/>
            <!-- Шаг 3: Маппинг цветов на фирменную палитру #143127 (темный) и #efe3da (светлый) -->
            <feComponentTransfer>
                <feFuncR type="table" tableValues="0.078 0.937"/>
                <feFuncG type="table" tableValues="0.192 0.89"/>
                <feFuncB type="table" tableValues="0.153 0.855"/>
            </feComponentTransfer>
        </filter>
    </svg>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Инициализация Web Audio API для ретро-синтезатора звуков оркестра
        let audioCtx = null;
        const playSynthSound = (frequency, type = 'sine', duration = 0.5) => {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio Context not started or blocked", e);
            }
        };

        // Декоративные векторные каракули из брендбука
        const ScribbleDecoration = ({ className = "", type = 1 }) => {
            if (type === 1) {
                return (
                    <svg className={`scribble-animate ${className}`} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 100 C 40 20, 160 20, 180 100 C 160 180, 40 180, 20 100 Z" stroke="#ff5757" strokeWidth="4" strokeLinecap="round"/>
                        <path d="M50 100 C 70 50, 130 50, 150 100" stroke="#ffba55" strokeWidth="3" strokeDasharray="5 5"/>
                    </svg>
                );
            }
            return (
                <svg className={`scribble-animate ${className}`} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 80 Q 52.5 10, 95 80 T 180 80" stroke="#ffba55" strokeWidth="5" strokeLinecap="round"/>
                    <path d="M30 120 Q 72.5 190, 115 120 T 170 120" stroke="#ff5757" strokeWidth="3"/>
                </svg>
            );
        };

        const Lightbox = ({ item, onClose }) => (
            <div className="fixed inset-0 bg-[#143127]/95 z-50 flex items-center justify-center p-4" onClick={onClose}>
                <div className="max-w-4xl w-full bg-[#efe3da] p-6 rounded-3xl border-4 border-[#143127] relative" onClick={e => e.stopPropagation()}>
                    <button onClick={onClose} className="absolute -top-4 -right-4 bg-[#ff5757] text-[#efe3da] border-4 border-[#143127] w-12 h-12 rounded-full font-steppe flex items-center justify-center hover:bg-[#ffba55] transition-colors">✕</button>
                    <img src={item.img} alt={item.title} className="w-full h-auto rounded-2xl border-4 border-[#143127] brand-engraving mb-4" />
                    <span className="bg-[#ffba55] text-[#143127] border-2 border-[#143127] px-3 py-1 rounded-full text-xs font-steppe uppercase mb-2 inline-block">{item.category}</span>
                    <h3 className="font-druzhok text-2xl mb-1 text-[#143127]">{item.title}</h3>
                    <p className="text-[#143127]/80">{item.desc}</p>
                </div>
            </div>
        );

        // Интерактивный выбор мест в зрительном зале (схема зала в цветах бренда)
        const TicketModal = ({ concert, onClose }) => {
            const [selectedSeats, setSelectedSeats] = useState([]);
            const [bought, setBought] = useState(false);
            
            const rows = 6;
            const seatsPerRow = 10;
            const price = concert.price || 1500;

            const toggleSeat = (row, seat) => {
                const seatId = `${row}-${seat}`;
                if (selectedSeats.includes(seatId)) {
                    setSelectedSeats(selectedSeats.filter(s => s !== seatId));
                    playSynthSound(300, 'sine', 0.1);
                } else {
                    setSelectedSeats([...selectedSeats, seatId]);
                    playSynthSound(500, 'sine', 0.15);
                }
            };

            const handlePurchase = () => {
                setBought(true);
                playSynthSound(800, 'triangle', 0.4);
                setTimeout(() => {
                    playSynthSound(1000, 'sine', 0.5);
                }, 150);
            };

            return (
                <div className="fixed inset-0 bg-[#143127]/90 z-50 flex items-center justify-center p-4">
                    <div className="max-w-2xl w-full bg-[#efe3da] p-8 rounded-3xl border-4 border-[#143127] relative max-h-[90vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-4 right-4 bg-[#ff5757] text-[#efe3da] border-4 border-[#143127] w-10 h-10 rounded-full flex items-center justify-center font-bold hover:bg-[#ffba55] transition-colors">✕</button>
                        
                        {!bought ? (
                            <>
                                <span className="bg-[#ff5757] text-white px-3 py-1 rounded-full text-xs font-steppe uppercase">{concert.tag}</span>
                                <h3 className="font-druzhok text-3xl mt-2 mb-1 text-[#143127]">{concert.title}</h3>
                                <p className="text-sm text-[#143127]/70 font-steppe mb-6">{concert.date} • {concert.time} • {concert.venue}</p>

                                <div className="w-full bg-[#143127] text-[#efe3da] text-center py-2 rounded-xl font-steppe text-xs uppercase tracking-widest mb-8 border-2 border-[#ffba55]">
                                    СЦЕНА ОРКЕСТРА
                                </div>

                                <div className="flex flex-col gap-3 justify-center items-center mb-8">
                                    {Array.from({ length: rows }).map((_, rIdx) => (
                                        <div key={rIdx} className="flex gap-2 items-center">
                                            <span className="w-4 text-xs font-steppe text-[#143127]/50">{rIdx + 1}</span>
                                            {Array.from({ length: seatsPerRow }).map((_, sIdx) => {
                                                const seatId = `${rIdx + 1}-${sIdx + 1}`;
                                                const isSelected = selectedSeats.includes(seatId);
                                                const isTaken = (rIdx * sIdx) % 7 === 1 || (rIdx + sIdx) % 9 === 0;
                                                return (
                                                    <button
                                                        key={sIdx}
                                                        disabled={isTaken}
                                                        onClick={() => toggleSeat(rIdx + 1, sIdx + 1)}
                                                        className={`w-6 h-6 rounded-md border-2 border-[#143127] transition-all flex items-center justify-center text-[8px] font-bold
                                                            ${isTaken ? 'bg-[#143127]/20 border-dashed cursor-not-allowed text-[#143127]/20' : 
                                                              isSelected ? 'bg-[#ff5757] text-[#efe3da] scale-110 shadow-sm' : 'bg-[#ffffff] hover:bg-[#ffba55] text-[#143127]'}
                                                        `}
                                                        title={`Ряд ${rIdx + 1}, Место ${sIdx + 1}`}
                                                    >
                                                        {sIdx + 1}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>

                                <div className="flex gap-4 justify-center text-xs font-steppe mb-6 text-[#143127]">
                                    <div className="flex items-center gap-1">
                                        <div className="w-4 h-4 bg-white border-2 border-[#143127] rounded"></div> Свободно
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <div className="w-4 h-4 bg-[#ff5757] border-2 border-[#143127] rounded"></div> Выбрано
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <div className="w-4 h-4 bg-[#143127]/20 border-2 border-dashed border-[#143127]/20 rounded"></div> Занято
                                    </div>
                                </div>

                                <div className="border-t-4 border-dashed border-[#143127] pt-6 flex justify-between items-center">
                                    <div>
                                        <p className="text-xs font-steppe text-[#143127]/60">Выбрано мест: {selectedSeats.length}</p>
                                        <p className="text-2xl font-druzhok text-[#143127]">{selectedSeats.length * price} ₽</p>
                                    </div>
                                    <button 
                                        onClick={handlePurchase}
                                        disabled={selectedSeats.length === 0}
                                        className={`px-6 py-3 rounded-xl font-steppe text-sm uppercase tracking-wider neo-btn transition-all 
                                            ${selectedSeats.length === 0 ? 'bg-gray-400 opacity-50 cursor-not-allowed shadow-none border-gray-500 text-gray-700' : 'bg-[#ff5757] text-white'}`}
                                    >
                                        Оформить заказ
                                    </button>
                                </div>
                            </>
                        ) : (
                            <div className="text-center py-12">
                                <span className="text-6xl block mb-4">🎟️</span>
                                <h4 className="font-druzhok text-3xl text-[#143127] mb-2">УСПЕШНО ЗАБРОНИРОВАНО!</h4>
                                <p className="font-steppe text-sm text-[#143127]/70 mb-6">Ваши билеты отправлены на почту. Ждем вас в зале!</p>
                                <button onClick={onClose} className="px-6 py-3 bg-[#143127] text-white font-steppe uppercase text-xs rounded-xl neo-btn">Отлично</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Layout = ({ children, currentPage, setPage }) => (
            <div className="min-h-screen flex flex-col relative">
                <header className="border-b-4 border-[#143127] bg-[#efe3da] px-6 py-5 flex justify-between items-center sticky top-0 z-40">
                    <div onClick={() => setPage('home')} className="bg-[#ff5757] text-[#efe3da] px-5 py-2.5 rounded-xl border-3 border-[#143127] font-druzhok text-xl cursor-pointer hover:bg-[#ffba55] transition-colors select-none flex items-center gap-1">
                        17<span className="text-[#143127]">f</span>03
                    </div>
                    <nav className="hidden md:flex gap-8 font-steppe text-xs font-extrabold uppercase tracking-widest text-[#143127]">
                        {[
                            { id: 'home', label: 'Главная' },
                            { id: 'afisha', label: 'Афиша' },
                            { id: 'about', label: 'О нас' },
                            { id: 'gallery', label: 'Галерея' },
                            { id: 'contacts', label: 'Контакты' }
                        ].map(item => (
                            <button 
                                key={item.id} 
                                onClick={() => {
                                    setPage(item.id);
                                    window.scrollTo({ top: 0, behavior: 'smooth' });
                                }} 
                                className={`pb-1 border-b-2 hover:text-[#ff5757] transition-all ${currentPage === item.id ? 'border-[#ff5757] text-[#ff5757]' : 'border-transparent'}`}
                            >
                                {item.label}
                            </button>
                        ))}
                    </nav>
                </header>

                <main className="flex-grow">{children}</main>

                <footer className="border-t-4 border-[#143127] bg-[#efe3da] py-16 px-8 relative overflow-hidden">
                    <div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-12 relative z-10">
                        <div>
                            <div className="bg-[#ff5757] text-[#efe3da] px-4 py-2 rounded-xl border-3 border-[#143127] font-druzhok text-xl w-max mb-6">
                                17f03
                            </div>
                            <p className="text-sm text-[#143127]/80 max-w-sm font-medium leading-relaxed">
                                Самый нестандартный оркестр России. Микс юмора, искусства, классических канонов и духа свободы Нового Времени.
                            </p>
                        </div>
                        <div>
                            <h4 className="font-steppe text-sm uppercase tracking-wider text-[#143127]/50 mb-4">Навигация</h4>
                            <div className="grid grid-cols-2 gap-2 text-sm font-bold text-[#143127]">
                                <button onClick={() => setPage('home')} className="text-left hover:text-[#ff5757]">Главная</button>
                                <button onClick={() => setPage('afisha')} className="text-left hover:text-[#ff5757]">Афиша</button>
                                <button onClick={() => setPage('about')} className="text-left hover:text-[#ff5757]">О нас</button>
                                <button onClick={() => setPage('gallery')} className="text-left hover:text-[#ff5757]">Галерея</button>
                                <button onClick={() => setPage('contacts')} className="text-left hover:text-[#ff5757]">Контакты</button>
                            </div>
                        </div>
                        <div>
                            <h4 className="font-steppe text-sm uppercase tracking-wider text-[#143127]/50 mb-4">Контакты</h4>
                            <p className="font-druzhok text-lg text-[#143127] mb-2">8 800 555 35 35</p>
                            <p className="font-steppe text-xs text-[#143127] underline decoration-[#ff5757] decoration-2">orchestra1703@gmail.com</p>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto mt-12 pt-8 border-t-2 border-[#143127]/20 text-center text-xs font-steppe text-[#143127]/60">
                        © 2026 Оркестр 1703. Все права защищены. Дизайн в стиле Swiss Brutalism.
                    </div>
                </footer>
            </div>
        );

        const HomePage = ({ setPage, setSelectedEvent }) => {
            const [uploadedImg, setUploadedImg] = useState(null);
            const [tempo, setTempo] = useState(1);
            const [selectedConcert, setSelectedConcert] = useState(null);
            const canvasRef = useRef(null);
            
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setUploadedImg(event.target.result);
                        playSynthSound(440, 'triangle', 0.2);
                    };
                    reader.readAsDataURL(file);
                }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let angle = 0;

                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.strokeStyle = '#143127';
                    ctx.lineWidth = 3;
                    
                    ctx.beginPath();
                    for (let x = 0; x < canvas.width; x++) {
                        const y = canvas.height / 2 + Math.sin(x * 0.02 + angle) * 30 * tempo + Math.cos(x * 0.01 - angle) * 15;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();

                    ctx.fillStyle = '#ff5757';
                    ctx.beginPath();
                    ctx.arc(100 + Math.sin(angle) * 50, canvas.height / 2 - 40 * tempo, 8 * tempo, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffba55';
                    ctx.beginPath();
                    ctx.arc(200 + Math.cos(angle) * 30, canvas.height / 2 + 30 * tempo, 12, 0, Math.PI * 2);
                    ctx.fill();

                    angle += 0.05 * tempo;
                    animationId = requestAnimationFrame(draw);
                };

                draw();
                return () => cancelAnimationFrame(animationId);
            }, [tempo]);

            const nearestConcerts = [
                {
                    id: 'snezhanya_koroleva',
                    title: "СНЕЖНАЯ КОРОЛЕВА",
                    date: "22 ДЕКАБРЯ",
                    time: "20:00",
                    venue: "Планетарий №1",
                    tag: "Эксперимент",
                    price: 2200,
                    img: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?q=80&w=600&auto=format&fit=crop"
                },
                {
                    id: 'alie_parusa',
                    title: "АЛЫЕ ПАРУСА",
                    date: "27 ЯНВАРЯ",
                    time: "19:00",
                    venue: "Санкт-Петербургская Филармония",
                    tag: "Классика",
                    price: 1800,
                    img: "https://images.unsplash.com/photo-1511192336575-5a79af67a629?q=80&w=600&auto=format&fit=crop"
                },
                {
                    id: 'skazochny_mir',
                    title: "СКАЗОЧНЫЙ МИР РУССКОЙ КЛАССИКИ",
                    date: "20 ФЕВРАЛЯ",
                    time: "19:00",
                    venue: "Капелла",
                    tag: "Орган",
                    price: 1500,
                    img: "https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?q=80&w=600&auto=format&fit=crop"
                }
            ];

            return (
                <div className="relative">
                    {/* Герой-секция */}
                    <section className="relative min-h-[85vh] flex items-center justify-center py-20 px-6 border-b-4 border-[#143127] overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <canvas ref={canvasRef} className="w-full h-full object-cover brand-engraving opacity-80" width="800" height="500" />
                            <div className="absolute inset-0 bg-[#efe3da]/40 pointer-events-none"></div>
                        </div>

                        <div className="max-w-7xl mx-auto w-full grid md:grid-cols-2 gap-12 relative z-10 items-center">
                            <div className="space-y-6">
                                <span className="bg-[#ffba55] text-[#143127] border-3 border-[#143127] px-4 py-2 rounded-xl text-xs font-steppe uppercase inline-block rotate-[-2deg] shadow-[3px_3px_0px_0px_#143127]">
                                    Тенденции 2026 года
                                </span>
                                <h1 className="font-druzhok text-5xl md:text-7xl text-[#143127] leading-none uppercase">
                                    САМЫЙ <br />
                                    <span className="text-[#ff5757]">НЕСТАНДАРТНЫЙ</span> <br />
                                    ОРКЕСТР
                                </h1>
                                <p className="font-despair text-2xl text-[#143127]/90 leading-tight">
                                    Микс классической виртуозности, юмора и бескомпромиссной подачи
                                </p>
                                <div className="flex flex-wrap gap-4 pt-4">
                                    <button onClick={() => setPage('afisha')} className="bg-[#ff5757] text-white px-8 py-4 rounded-xl text-sm font-steppe uppercase tracking-wider neo-btn">
                                        Купить билеты
                                    </button>
                                    <button onClick={() => setPage('about')} className="bg-[#ffffff] text-[#143127] px-8 py-4 rounded-xl text-sm font-steppe uppercase tracking-wider neo-btn">
                                        Оркестранты
                                    </button>
                                </div>
                            </div>

                            <div className="relative flex justify-center">
                                <ScribbleDecoration className="absolute -top-12 -left-12 w-32 h-32 z-0" type={1} />
                                <div className="w-80 h-80 md:w-[400px] md:h-[400px] rounded-full overflow-hidden border-4 border-[#143127] bg-[#143127] shadow-[10px_10px_0px_0px_#ffba55] relative z-10">
                                    <img 
                                        src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?q=80&w=800&auto=format&fit=crop" 
                                        className="w-full h-full object-cover brand-engraving scale-110" 
                                        alt="Orchestra Hero"
                                        onError={(e) => { e.target.src = "https://placehold.co/800x800/143127/efe3da?text=1703"; }}
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                                    <p className="font-steppe text-sm text-[#143127]/70">Спасибо за обратную связь. Мы ответим вам в течение 1–2 рабочих дней.</p>
                                    <button 
                                        onClick={() => {
                                            setSubmitted(false);
                                            setFormData({ name: '', surname: '', email: '', subject: '', message: '' });
                                        }} 
                                        className="mt-6 px-6 py-3 bg-[#143127] text-white font-steppe uppercase text-xs rounded-xl neo-btn"
                                    >
                                        Написать еще
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = useState('home');
            const [selectedEvent, setSelectedEvent] = useState('snezhanya_koroleva');

            return (
                <Layout currentPage={page} setPage={setPage}>
                    {page === 'home' && <HomePage setPage={setPage} setSelectedEvent={setSelectedEvent} />}
                    {page === 'afisha' && <AfishaPage setPage={setPage} setSelectedEvent={setSelectedEvent} />}
                    {page === 'about' && <AboutPage />}
                    {page === 'gallery' && <GalleryPage />}
                    {page === 'contacts' && <ContactsPage />}
                    {page === 'event' && <EventPage eventId={selectedEvent} setPage={setPage} />}
                </Layout>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
